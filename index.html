<body data-modo="participante" data-exec="https://script.google.com/macros/s/AKfycbzeeQ1Z92MBu-YQZGm9NDRubRVKg_6udf8Eq78K-o_IrGgQgib2O1VVVp6yHXhBMUMb/exec" data-sw="sw.js">

      <div class="btns"><button class="btn primary" id="btnTentar">Tentar de novo</button></div>
    </div>
